name: CI
# turbo remote cache enabled via TURBO_TEAM + TURBO_TOKEN repo secrets (verified)

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "prisma/**"
      - "scripts/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "openapi.json"
  # No workflow-level path filter on PRs: every job is a required check on main,
  # and a PR whose workflow never ran could not be merged. The `changes` job
  # applies the same filter instead; the other jobs skip (= pass) without code changes.
  pull_request:
    branches: [main]
env:
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # ─── Change detection (required check) ─────────────────────────────────────
  # Keep CODE_PATHS in sync with on.push.paths. If this job fails, every job
  # below is skipped, which counts as passing, so this job must stay required.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE_PATHS='^(apps/|packages/|prisma/|scripts/|\.github/workflows/)|^(bun\.lock|package\.json|openapi\.json)$|^tsconfig[^/]*\.json$'
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf 'Changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$CODE_PATHS"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code changes: the other CI jobs are skipped."
          fi

  # ─── Typecheck + Lint (parallel) ────────────────────────────────────────────
  checks:
    name: ${{ matrix.check }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        check: [type-check, lint]
    # Skipped per step, not per job: a skipped matrix job reports under its
    # unexpanded name, so the required lint / type-check checks would never arrive.
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - if: needs.changes.outputs.code == 'true'
        name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - if: needs.changes.outputs.code == 'true'
        name: Install dependencies
        run: bun install --frozen-lockfile

      - if: needs.changes.outputs.code == 'true'
        name: Generate Prisma client
        run: bun run db:generate

      - if: needs.changes.outputs.code == 'true'
        name: Generate OPENAPI types
        run: bun run generate:cli

      - if: needs.changes.outputs.code == 'true'
        name: ${{ matrix.check }}
        run: bun run ${{ matrix.check }}

  # ─── Web Build (H8 regression guard) ───────────────────────────────────────
  web-build:
    name: web build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build --filter=@nathapp/koda-web

  # ─── Policy Gates ────────────────────────────────────────────────────────
  policy-gates:
    name: policy-gates
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      - name: Run policy gates
        run: cd apps/api && bun run policy:gates -- --project=test-project

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-gate-results
          path: apps/api/test/policy-gates/results.json

      - name: Upload SLO snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-snapshot
          path: apps/api/test/policy-gates/slo-snapshot.json

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      - name: Test
        run: bunx turbo run test -- --bail

  # ─── Integration + e2e (Postgres) ───────────────────────────────────────────
  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U koda -d koda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      # acceptance-mem-phase2's AC-4 spawns `bun run evaluate:retrieval`, which
      # imports apps/api/dist — the API must be built before the suite runs.
      - name: Build API
        run: bunx turbo run build --filter=@nathapp/koda-api

      - name: Integration + e2e (Postgres)
        run: cd apps/api && bun run test:integration
        env:
          DATABASE_URL: postgresql://koda:koda@localhost:5433/koda_test

  # ─── Web e2e (Playwright, Postgres, built web) ─────────────────────────────
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U koda -d koda_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build web
        run: bunx turbo run build --filter=@nathapp/koda-web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Playwright
        run: cd apps/web && bun run test:e2e
        env:
          CI: "true"
          E2E_WEB_MODE: build
          E2E_DATABASE_URL: postgresql://koda:koda@localhost:5433/koda_e2e
          # Dummy secrets for the e2e API only (env validation requires them).
          JWT_SECRET: e2e-jwt-secret-not-a-real-secret
          JWT_REFRESH_SECRET: e2e-jwt-refresh-secret-not-a-real-secret
          API_KEY_SECRET: e2e-api-key-secret-not-a-real-secret
          RAG_IN_MEMORY_ONLY: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # ─── Retrieval Evaluation ───────────────────────────────────────────────────
  evaluate:
    name: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, checks, test]
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koda -d koda_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      - name: Build API
        run: bunx turbo run build --filter=@nathapp/koda-api

      - name: Migrate database
        run: cd apps/api && bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ vars.EVAL_DATABASE_URL || 'postgresql://koda:koda@localhost:5432/koda_eval' }}

      - name: Evaluate retrieval
        run: cd apps/api && bun run evaluate:retrieval
        env:
          DATABASE_URL: ${{ vars.EVAL_DATABASE_URL || 'postgresql://koda:koda@localhost:5432/koda_eval' }}
          RAG_EVAL_PROJECT_ID: proj_eval_001
          # Dummy secrets — required by env validation but not used in eval (no auth/JWTs issued)
          JWT_SECRET: eval-jwt-secret-not-used-in-eval
          JWT_REFRESH_SECRET: eval-jwt-refresh-secret-not-used-in-eval
          API_KEY_SECRET: eval-api-key-secret-not-used-in-eval
          RAG_IN_MEMORY_ONLY: "true"

  # ─── Smoke Test (API + CLI) ────────────────────────────────────────────────
  smoke:
    name: smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_smoke
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U koda -d koda_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      - name: Smoke test
        run: bash scripts/smoke-test-cli.sh
        env:
          SMOKE_DATABASE_URL: postgresql://koda:koda@localhost:5433/koda_smoke
