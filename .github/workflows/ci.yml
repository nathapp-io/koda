name: CI
# turbo remote cache enabled via TURBO_TEAM + TURBO_TOKEN repo secrets (verified)

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "prisma/**"
      - "scripts/**"
      - "deployments/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "docker-compose.test.yml"
      - "openapi-ts.config.ts"
      - "test/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "openapi.json"
      - "turbo.json"
      - ".nax/**"
  # No workflow-level path filter on PRs: a PR whose workflow never ran could not
  # be merged because its required checks would never report. The `changes` job
  # applies the same filter instead; the required jobs skip (= pass) without code changes.
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch/PR cancels the superseded run instead of letting it
# finish; only the latest run per ref keeps burning runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change detection (required check) ─────────────────────────────────────
  # Keep CODE_PATHS in sync with on.push.paths. If this job fails, every job
  # below is skipped, which counts as passing, so this job must stay required.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE_PATHS='^(apps/|packages/|prisma/|scripts/|deployments/|test/|\.github/workflows/|\.nax/)|^(bun\.lock|package\.json|openapi\.json|openapi-ts\.config\.ts|docker-compose(\.(dev|test))?\.yml|turbo\.json)$|^tsconfig[^/]*\.json$'
          # `-z` keeps the paths Git's raw bytes: without it Git C-quotes a non-ASCII path
          # ("deployments/caf\303\251.sh"), which no path pattern matches, so a deployment-only PR would
          # count as no change (review B7). The listing goes to a file first so a Git failure is the step's
          # failure and the NUL bytes survive, and every record is matched on its own with a NUL delimiter:
          # a path may legally contain a newline, and converting NULs to newlines would split one real path
          # into fragments that match by accident (review B7). Reading a file (never a pipe into a
          # early-exiting reader) also keeps the K7 SIGPIPE hazard closed, and `[[ =~ ]]` matches per
          # string, not per line, so a fragment can never be mistaken for a changed path.
          changed_list=$(mktemp)
          trap 'rm -f "$changed_list"' EXIT
          # Report both the deleted and added paths when a file moves in or out of scope.
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_list"
          printf 'Changed files:\n'
          code=false
          while IFS= read -r -d '' changed_path; do
            printf '%s\n' "$changed_path"
            if [[ "$changed_path" =~ $CODE_PATHS ]]; then
              code=true
            fi
          done < "$changed_list"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "No code changes: the other CI jobs are skipped."
          fi

  # ─── Static quality gates (required check: quality) ────────────────────────
  # Lint, type-check, the web build and the policy gates share one setup and are
  # all turbo-cached (~13s of real work combined), so they run in a single job
  # instead of four. Check steps are gated on setup success rather than the job
  # status, so one failing gate still reports the others like the old jobs did.
  quality:
    name: quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        id: setup
        run: bun run generate:cli

      - name: Lint
        if: steps.setup.outcome == 'success'
        run: bun run lint

      - name: Type check
        if: steps.setup.outcome == 'success'
        run: bun run type-check

      - name: Build web
        if: steps.setup.outcome == 'success'
        run: bun run build --filter=@nathapp/koda-web

      - name: Run policy gates
        if: steps.setup.outcome == 'success'
        run: cd apps/api && bun run policy:gates -- --project=test-project

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-gate-results
          path: apps/api/test/policy-gates/results.json

      - name: Upload SLO snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slo-snapshot
          path: apps/api/test/policy-gates/slo-snapshot.json

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      - name: Test
        run: bunx turbo run test -- --bail=1

  # ─── Integration + e2e (Postgres, sharded) ─────────────────────────────────
  # 571 DB suites run one file at a time (they share one Postgres schema and
  # resetDb() truncates it), so a single job spends ~18m in Vitest. The files are
  # independent once each shard has its own database, so split them across
  # runners with Vitest's --shard. Each shard keeps its own Postgres service, so
  # the run lock/schema reset semantics are unchanged.
  integration-shards:
    name: integration shard ${{ matrix.shard }}/${{ matrix.shards }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    strategy:
      # One failing shard must not cancel the others: the aggregator below needs
      # the complete picture, and a partial run hides which suites are broken.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        shards: [4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_test
        ports:
          - 5433:5432
        # --tmpfs keeps Postgres on memory-backed storage (test data only), like docker-compose.test.yml locally.
        options: >-
          --health-cmd "pg_isready -U koda -d koda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      # acceptance-mem-phase2's AC-4 spawns `bun run evaluate:retrieval`, which
      # imports apps/api/dist — the API must be built before the suite runs.
      - name: Build API
        run: bunx turbo run build --filter=@nathapp/koda-api

      # The shard list and the denominator are edited independently. If they drift,
      # the executed legs all pass while the missing denominators never run, and the
      # aggregator would still go green. Fail before the suite starts instead.
      - name: Verify shard matrix
        run: test "${{ strategy.job-total }}" = "${{ matrix.shards }}"

      - name: Integration + e2e (Postgres, shard ${{ matrix.shard }}/${{ matrix.shards }})
        # Bun strips the first `--`; `bun run test:integration` forwards the shard flag to Vitest.
        run: cd apps/api && bun run test:integration -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          # Explicit, so a broken service fails the job instead of falling back to Testcontainers.
          KODA_TEST_DATABASE_URL: postgresql://koda:koda@localhost:5433/koda_test

  # ─── Integration gate (required-check name) ────────────────────────────────
  # Branch protection on main requires a check named exactly `integration`. A
  # matrix publishes `integration shard 1/4`, ... instead, so this cheap job
  # keeps the old name and fails when any shard failed or was cancelled.
  integration:
    name: integration
    needs: [changes, integration-shards]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check shard results
        run: |
          echo "integration shards: ${{ needs.integration-shards.result }}"
          test "${{ needs.integration-shards.result }}" = "success"

  # ─── Runner integration (Postgres, built API) ───────────────────────────────
  # Runs in parallel with `integration`: the runner suite uses its own database
  # (`koda_runner_test`, auto-created by `prisma migrate reset`; see
  # apps/runner/test/integration/harness/database.ts), so it never contends with
  # the API jest run on `koda_test`. NOTE: add `runner integration` to the
  # required checks if the suite should gate merges.
  runner-integration:
    name: runner integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_test
        ports:
          - 5433:5432
        # --tmpfs keeps Postgres on memory-backed storage (test data only), like docker-compose.test.yml locally.
        options: >-
          --health-cmd "pg_isready -U koda -d koda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      # The runner suite spawns the built API (apps/api/dist) against koda_runner_test.
      - name: Build API
        run: bunx turbo run build --filter=@nathapp/koda-api

      - name: Runner integration (Postgres, built API)
        run: cd apps/runner && bun run test:integration
        env:
          KODA_DB_TESTS: "1"

  # ─── Web e2e (Playwright, Postgres, built web) ─────────────────────────────
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # ubuntu-latest migrated to Ubuntu 26.04 (Oct 2026); Playwright has no
    # chromium build for ubuntu26.04-x64 yet, so pin this job to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_e2e
        ports:
          - 5433:5432
        # --tmpfs keeps Postgres on memory-backed storage (test data only), like docker-compose.test.yml locally.
        options: >-
          --health-cmd "pg_isready -U koda -d koda_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      # The Playwright API webServer runs `node dist/main.js` (E2E_API_MODE=dist)
      # instead of `bunx nest start`, which recompiles the whole app on the
      # webServer's critical path.
      - name: Build API
        run: bunx turbo run build --filter=@nathapp/koda-api

      - name: Build web
        run: bunx turbo run build --filter=@nathapp/koda-web

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # No --with-deps: it runs apt-get, and an Ubuntu mirror DNS outage on the runner failed this job before any
      # test ran (PR #439). The ubuntu-24.04 image ships Google Chrome, so Chromium's system libraries are present;
      # the browser itself downloads from Playwright's CDN. A missing library fails the browser launch loudly.
      - name: Install Playwright Chromium
        run: cd apps/web && bunx playwright install chromium

      - name: Playwright
        run: cd apps/web && bun run test:e2e
        env:
          CI: "true"
          E2E_WEB_MODE: build
          E2E_API_MODE: dist
          E2E_DATABASE_URL: postgresql://koda:koda@localhost:5433/koda_e2e
          # Dummy secrets for the e2e API only (env validation requires them).
          JWT_SECRET: e2e-jwt-secret-not-a-real-secret
          JWT_REFRESH_SECRET: e2e-jwt-refresh-secret-not-a-real-secret
          API_KEY_SECRET: e2e-api-key-secret-not-a-real-secret
          RAG_IN_MEMORY_ONLY: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # ─── Retrieval Evaluation ───────────────────────────────────────────────────
  evaluate:
    name: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, quality, test]
    if: needs.changes.outputs.code == 'true'
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_eval
        ports:
          - 5432:5432
        # --tmpfs keeps Postgres on memory-backed storage (test data only), like docker-compose.test.yml locally.
        options: >-
          --health-cmd "pg_isready -U koda -d koda_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      - name: Build API
        run: bunx turbo run build --filter=@nathapp/koda-api

      - name: Migrate database
        run: cd apps/api && bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ vars.EVAL_DATABASE_URL || 'postgresql://koda:koda@localhost:5432/koda_eval' }}

      - name: Evaluate retrieval
        run: cd apps/api && bun run evaluate:retrieval
        env:
          DATABASE_URL: ${{ vars.EVAL_DATABASE_URL || 'postgresql://koda:koda@localhost:5432/koda_eval' }}
          RAG_EVAL_PROJECT_ID: proj_eval_001
          # Dummy secrets — required by env validation but not used in eval (no auth/JWTs issued)
          JWT_SECRET: eval-jwt-secret-not-used-in-eval
          JWT_REFRESH_SECRET: eval-jwt-refresh-secret-not-used-in-eval
          API_KEY_SECRET: eval-api-key-secret-not-used-in-eval
          RAG_IN_MEMORY_ONLY: "true"

  # ─── Smoke Test (API + CLI) ────────────────────────────────────────────────
  smoke:
    name: smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koda
          POSTGRES_PASSWORD: koda
          POSTGRES_DB: koda_smoke
        ports:
          - 5433:5432
        # --tmpfs keeps Postgres on memory-backed storage (test data only), like docker-compose.test.yml locally.
        options: >-
          --health-cmd "pg_isready -U koda -d koda_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate OPENAPI types
        run: bun run generate:cli

      - name: Smoke test
        run: bash scripts/smoke-test-cli.sh
        env:
          SMOKE_DATABASE_URL: postgresql://koda:koda@localhost:5433/koda_smoke
