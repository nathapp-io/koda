name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-canary.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-publish (e.g. v0.1.0). Builds that tag's commit, never main."
        required: true
        type: string

# Review E/SEC-8: nothing by default; each job asks for only what it needs. Third-party actions are pinned to
# full commit SHAs (the comment names the version); Dependabot bumps them (.github/dependabot.yml).
permissions: {}

# One release publishes at a time (review B4). The channel eligibility computed in `info` is only valid while no
# other run can publish between that computation and the pushes: with two runs in flight, an older tag could
# compute "I am the newest" before a newer tag is pushed, wait for approval or a build, and then move `:latest`,
# the npm dist-tags and the GitHub latest flag back to itself. Queueing (not cancelling) keeps a release that a
# tag push arrived next to, instead of dropping it; it also keeps immutable tag builds from running beside a
# publishing run.
#
# A concurrency group holds one running run and ONE pending run — Actions replaces the pending one — so a third
# release request that arrives while both slots are taken is cancelled before it publishes (review B11). GitHub
# has no deeper, non-replacing queue to ask for, so that run is recovered by requesting the release again, which
# is the documented re-publish path: Actions -> Release -> "Run workflow" with its tag, or
# `gh workflow run release.yml -f tag=v0.4.3`. A cancelled run published nothing, and a repeated request
# converges, because publishing a tag that is already out is idempotent (npm skips a version that exists,
# Docker pushes the same tag again). To avoid the third-slot case, let the previous release finish, approvals
# included, before requesting the next one.
concurrency:
  group: release-publish
  cancel-in-progress: false

# ─── Shared info ──────────────────────────────────────────────────────────────

jobs:
  info:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      npm_tag: ${{ steps.channels.outputs.npm_tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      notify: ${{ steps.info.outputs.notify }}
      docker_tags_api: ${{ steps.channels.outputs.tags_api }}
      docker_tags_web: ${{ steps.channels.outputs.tags_web }}
      latest: ${{ steps.channels.outputs.latest }}
    steps:
      # Review E/SEC-9: workflow inputs reach scripts through env, never through ${{ }} inside run:.
      - name: Set release info
        id: info
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$ ]]; then
            echo "❌ Not a release tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == *"-canary."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "notify=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "notify=true" >> "$GITHUB_OUTPUT"
          fi

      # Review E/BUG-4: every job checks out the tag itself. A re-publish of v0.4.0 rebuilds v0.4.0's commit
      # (and fails when the tag does not exist) instead of pushing main under a published version tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.info.outputs.tag }}

      - name: Validate version
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "❌ Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version match: $TAG"

      - name: Compute release channels
        id: channels
        env:
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail
          # Every comparison below is on decimal digits, so it must not depend on the runner's locale.
          export LC_ALL=C
          remote_tags=$(git ls-remote --tags --refs origin 'v*')

          if [[ "$TAG" == *"-canary."* ]]; then
            echo "tags_api=nathapp/koda-api:canary" >> "$GITHUB_OUTPUT"
            echo "tags_web=nathapp/koda-web:canary" >> "$GITHUB_OUTPUT"
            echo "npm_tag=canary" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A version component is a canonical decimal string: leading zeros stripped, so `04` and `4` are the
          # same minor. Components are never put through bash arithmetic: `10#08` family tricks are avoidable,
          # and a component past the 64-bit range wraps to a negative number, which compares as older than
          # every release and makes an old tag claim `:latest` (review B8).
          normalize_component() {
            local value="$1"
            while [[ "${#value}" -gt 1 && "$value" == 0* ]]; do
              value="${value#0}"
            done
            printf '%s' "$value"
          }

          # -1, 0 or 1 for two canonical decimal strings: longer is bigger, equal lengths compare bytewise
          # (both are pure digits, and LC_ALL=C keeps the comparison independent of the locale).
          compare_components() {
            local left="$1" right="$2"
            if [[ "${#left}" -lt "${#right}" ]]; then
              printf '%s' -1
              return 0
            fi
            if [[ "${#left}" -gt "${#right}" ]]; then
              printf '%s' 1
              return 0
            fi
            if [[ "$left" == "$right" ]]; then
              printf '%s' 0
              return 0
            fi
            if [[ "$left" < "$right" ]]; then
              printf '%s' -1
              return 0
            fi
            printf '%s' 1
          }

          is_older() {
            local left_major left_minor left_patch right_major right_minor right_patch comparison
            IFS=. read -r left_major left_minor left_patch <<< "${1#v}"
            IFS=. read -r right_major right_minor right_patch <<< "${2#v}"
            left_major="$(normalize_component "$left_major")"
            left_minor="$(normalize_component "$left_minor")"
            left_patch="$(normalize_component "$left_patch")"
            right_major="$(normalize_component "$right_major")"
            right_minor="$(normalize_component "$right_minor")"
            right_patch="$(normalize_component "$right_patch")"

            comparison="$(compare_components "$left_major" "$right_major")"
            if [[ "$comparison" != 0 ]]; then
              if [[ "$comparison" == -1 ]]; then return 0; else return 1; fi
            fi
            comparison="$(compare_components "$left_minor" "$right_minor")"
            if [[ "$comparison" != 0 ]]; then
              if [[ "$comparison" == -1 ]]; then return 0; else return 1; fi
            fi
            comparison="$(compare_components "$left_patch" "$right_patch")"
            if [[ "$comparison" == -1 ]]; then return 0; fi
            return 1
          }

          # Minor identity comes from the same canonical components, not from a textual prefix of the version:
          # `v0.04.2` and `v0.4.1` are both minor 0.4 (review B8).
          same_minor() {
            local left_major left_minor left_patch right_major right_minor right_patch
            IFS=. read -r left_major left_minor left_patch <<< "${1#v}"
            IFS=. read -r right_major right_minor right_patch <<< "${2#v}"
            if [[ "$(normalize_component "$left_major")" != "$(normalize_component "$right_major")" ]]; then
              return 1
            fi
            if [[ "$(normalize_component "$left_minor")" != "$(normalize_component "$right_minor")" ]]; then
              return 1
            fi
            return 0
          }

          latest=true
          minor_latest=true
          while IFS=$'\t' read -r _ remote_ref; do
            remote_tag="${remote_ref#refs/tags/}"
            [[ "$remote_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            if is_older "$TAG" "$remote_tag"; then
              latest=false
              if same_minor "$TAG" "$remote_tag"; then
                minor_latest=false
              fi
            fi
          done <<< "$remote_tags"

          IFS=. read -r major minor patch <<< "$VERSION"
          major="$(normalize_component "$major")"
          minor="$(normalize_component "$minor")"
          patch="$(normalize_component "$patch")"
          major_minor="${major}.${minor}"
          canonical_version="${major}.${minor}.${patch}"
          tags_api="nathapp/koda-api:${TAG}"
          tags_web="nathapp/koda-web:${TAG}"
          if [[ "$minor_latest" == true ]]; then
            tags_api+=",nathapp/koda-api:${major_minor}"
            tags_web+=",nathapp/koda-web:${major_minor}"
          fi
          if [[ "$latest" == true ]]; then
            tags_api+=",nathapp/koda-api:latest"
            tags_web+=",nathapp/koda-web:latest"
            npm_tag=latest
          elif [[ "$minor_latest" == true ]]; then
            npm_tag="release-${major_minor}"
          else
            npm_tag="backport-${canonical_version}"
          fi
          echo "tags_api=${tags_api}" >> "$GITHUB_OUTPUT"
          echo "tags_web=${tags_web}" >> "$GITHUB_OUTPUT"
          echo "npm_tag=${npm_tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

  # ─── CLI: npm publish ─────────────────────────────────────────────────────────

  cli:
    needs: info
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.info.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # A re-publish retries the Docker images after a partial failure; npm versions are immutable, so a
      # version that is already on npm is left alone instead of failing the run (and blocking the images).
      - name: Check npm for this version
        id: npm
        env:
          VERSION: ${{ needs.info.outputs.version }}
        run: |
          if npm view "@nathapp/koda-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@nathapp/koda-cli@${VERSION} is already on npm; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm.outputs.published != 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.npm.outputs.published != 'true'
        run: bun run db:generate

      - name: Generate OPENAPI types
        if: steps.npm.outputs.published != 'true'
        run: bun run generate:cli

      - name: Build CLI
        if: steps.npm.outputs.published != 'true'
        run: bunx turbo run build --filter=@nathapp/koda-cli

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        working-directory: apps/cli
        env:
          NPM_TAG: ${{ needs.info.outputs.npm_tag }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public --tag "$NPM_TAG" --provenance

  # ─── Docker: API ──────────────────────────────────────────────────────────────

  # Images push only after the CLI job succeeded (review E/BUG-4), so a failed release never leaves new images
  # behind a version that npm rejected.
  docker-api:
    needs: [info, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.info.outputs.tag }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.info.outputs.docker_tags_api }}
          build-args: |
            BUN_VERSION=1.4.4
            TURBO_VERSION=2.11.4
            BUILD_APP=api
            BUILD_APP_PACKAGE=@nathapp/koda-api
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Docker: Web ──────────────────────────────────────────────────────────────

  docker-web:
    needs: [info, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.info.outputs.tag }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.info.outputs.docker_tags_web }}
          build-args: |
            BUN_VERSION=1.4.4
            TURBO_VERSION=2.11.4
            BUILD_APP=web
            BUILD_APP_PACKAGE=@nathapp/koda-web
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── GitHub Release ───────────────────────────────────────────────────────────

  release:
    needs: [info, cli, docker-api, docker-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.info.outputs.tag }}
          name: ${{ needs.info.outputs.tag }}
          prerelease: ${{ needs.info.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ needs.info.outputs.latest }}

  # ─── Notify ───────────────────────────────────────────────────────────────────

  notify:
    needs: [info, release]
    if: needs.info.outputs.notify == 'true' && vars.TELEGRAM_CHAT_ID != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Telegram notification
        env:
          VERSION: ${{ needs.info.outputs.tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🚀 *Koda ${VERSION} released*

          \`\`\`
          npm install -g @nathapp/koda-cli
          docker pull nathapp/koda-api:${VERSION}
          docker pull nathapp/koda-web:${VERSION}
          \`\`\`

          https://github.com/nathapp-io/koda/releases/tag/${VERSION}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$MSG" || true
