name: koda-local

services:
  api:
    image: nathapp/koda-api:${KODA_VERSION:-latest}
    ports:
      - "${API_PORT:-3100}:3100"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-koda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-koda}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      API_KEY_SECRET: ${API_KEY_SECRET:-change-me-api-key}
      API_PORT: 3100
      API_PREFIX: api
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LANCEDB_PATH: /data/lancedb
    volumes:
      - koda_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-koda}
    volumes:
      - koda_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koda} -d ${POSTGRES_DB:-koda}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    image: nathapp/koda-web:${KODA_VERSION:-latest}
    ports:
      - "${WEB_PORT:-3101}:3101"
    environment:
      NUXT_API_INTERNAL_URL: http://api:3100
      PORT: 3101
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  koda_data:
    driver: local
  koda_pg:
    driver: local
