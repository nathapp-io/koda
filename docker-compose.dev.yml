services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    image: koda-api-dev:local
    working_dir: /app
    ports:
      - "${API_PORT:-3100}:3101"
    environment:
      DATABASE_URL: postgresql://koda:${POSTGRES_PASSWORD:-koda}@postgres:5432/koda
      JWT_SECRET: ${JWT_SECRET:-change-me-dev}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-dev-refresh}
      JWT_REFRESH_EXPIRES_IN: 30d
      API_KEY_SECRET: ${API_KEY_SECRET:-dev-api-key-secret-min-32-chars}
      API_PORT: 3101
      API_PREFIX: api
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - koda_data_dev:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "bun install --frozen-lockfile && bun run db:generate --filter=@nathapp/koda-api && (cd apps/api && bunx prisma migrate deploy) && bun run dev --filter=@nathapp/koda-api"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: no

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koda}
      POSTGRES_DB: ${POSTGRES_DB:-koda}
    ports:
      - "5432:5432"
    volumes:
      - koda_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koda} -d ${POSTGRES_DB:-koda}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    image: koda-web-dev:local
    working_dir: /app
    ports:
      - "${WEB_PORT:-3101}:3101"
    environment:
      # Internal URL: Nuxt server → API via Docker service name
      NUXT_API_INTERNAL_URL: http://api:3101
      PORT: 3101
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.nuxt
    command: sh -c "bun install --frozen-lockfile && bun run dev --filter=@nathapp/koda-web"
    depends_on:
      api:
        condition: service_healthy
    restart: no

volumes:
  koda_data_dev:
    driver: local
  koda_pg_dev:
    driver: local
