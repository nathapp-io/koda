# Local Postgres for apps/api integration/e2e tests and the CLI smoke test.
# Port 5433 so tests can never hit a dev database on 5432.
services:
  postgres-test:
    image: postgres:16
    # Start on demand with test:db:up. The test harness can also start its own temporary Postgres.
    restart: "no"
    environment:
      POSTGRES_USER: koda
      POSTGRES_PASSWORD: koda
      POSTGRES_DB: koda_test
    ports:
      - target: 5432
        published: "5433"
        host_ip: "${KODA_POSTGRES_BIND_IP:-127.0.0.1}"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koda -d koda_test"]
      interval: 2s
      timeout: 3s
      retries: 20
